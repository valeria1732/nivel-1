<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Madres Buscadoras - Nivel 1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #0d0906;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #gameContainer {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 1280px; max-height: 720px;
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
    background: #2b2118;
    overflow: hidden;
  }
  canvas {
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  #victoryOverlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(15, 10, 5, 0.94);
    align-items: center; justify-content: center;
    z-index: 50;
  }
  #victoryBox {
    width: 580px; height: 210px;
    background: #1a120a;
    border-top: 6px solid #ffd133;
    border-bottom: 6px solid #ffd133;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.85);
    cursor: pointer;
  }
  #victoryBox h1 {
    color: #ffe038;
    font-size: 62px;
    font-weight: 900;
    letter-spacing: 3px;
    text-align: center;
  }
  #soundBtn {
    position: absolute;
    top: 16px; right: 18px;
    padding: 10px 18px;
    border-radius: 26px;
    background: rgba(25, 18, 12, 0.9);
    border: 2.5px solid #ffd133;
    color: #ffe885;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    z-index: 40;
    box-shadow: 0 4px 14px rgba(0,0,0,0.7);
    touch-action: manipulation;
  }
  #soundBtn:active {
    transform: scale(0.94);
  }
  #touchControls {
    position: absolute;
    left: 0; right: 0; bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 18px;
    pointer-events: none;
    z-index: 30;
  }
  .touchGroup {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  .touchBtn {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(25, 18, 12, 0.78);
    border: 3px solid rgba(255, 215, 70, 0.9);
    color: #fff5cc;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.65);
    touch-action: none;
    cursor: pointer;
  }
  .touchBtn span {
    font-size: 10px;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .touchBtn:active, .touchBtn.active {
    background: rgba(255, 205, 45, 0.92);
    color: #1a120a;
    transform: scale(0.93);
  }
  @media (max-width: 768px) {
    .touchBtn { width: 62px; height: 62px; font-size: 18px; }
    #victoryBox { width: 90%; height: 160px; }
    #victoryBox h1 { font-size: 40px; }
    #soundBtn { top: 10px; right: 12px; padding: 8px 14px; font-size: 13px; }
  }

  #introOverlay {
    position: absolute; inset: 0;
    background: #0d0805;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 60;
    overflow: hidden;
    cursor: pointer;
    transition: opacity 0.45s ease;
  }
  #introBg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    animation: bgBreathe 7s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes bgBreathe {
    0% { transform: scale(1.0) rotate(-0.2deg); }
    100% { transform: scale(1.035) rotate(0.2deg); }
  }
  #emberCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 61;
  }
  #introPlayBtn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 62;
    min-width: 290px;
    height: 88px;
    padding: 0 46px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(78, 40, 18, 0.96) 0%, rgba(36, 17, 8, 0.98) 55%, rgba(20, 9, 4, 0.99) 100%);
    border: 3.5px solid #ffe082;
    color: #fff8e7;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    box-shadow: 0 0 28px rgba(255, 165, 35, 0.92), 0 0 60px rgba(255, 110, 20, 0.55), inset 0 0 20px rgba(255, 200, 80, 0.35);
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95), 0 0 14px rgba(255, 200, 70, 0.65);
    overflow: hidden;
    animation: btnPulse 1.7s ease-in-out infinite alternate;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    touch-action: manipulation;
  }
  #introPlayBtn::after {
    content: "";
    position: absolute;
    top: -50%; left: -60%;
    width: 45%; height: 200%;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,235,175,0.38) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(25deg);
    animation: btnShine 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes btnShine {
    0% { left: -65%; }
    55%, 100% { left: 135%; }
  }
  #introPlayBtn:hover, #introPlayBtn:active {
    transform: translate(-50%, -50%) scale(1.09);
    border-color: #ffffff;
    box-shadow: 0 0 40px rgba(255, 215, 70, 1), 0 0 80px rgba(255, 140, 25, 0.85), inset 0 0 28px rgba(255, 225, 110, 0.6);
  }
  @keyframes btnPulse {
    0% { transform: translate(-50%, -50%) scale(0.97); }
    100% { transform: translate(-50%, -50%) scale(1.05); }
  }
  #introHint {
    position: absolute;
    bottom: 34px; left: 50%;
    transform: translateX(-50%);
    z-index: 62;
    white-space: nowrap;
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(15, 10, 6, 0.82);
    border: 1.5px solid rgba(255, 215, 80, 0.75);
    color: #fff3c4;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.8px;
    text-shadow: 0 2px 6px #000;
  }
  #levelIntroBanner {
    position: absolute;
    top: 108px; left: 50%;
    transform: translateX(-50%);
    padding: 12px 32px;
    background: rgba(20, 13, 8, 0.90);
    border-top: 3px solid #ffd133;
    border-bottom: 3px solid #ffd133;
    color: #ffe899;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-align: center;
    z-index: 35;
    pointer-events: none;
    box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    transition: opacity 0.6s ease;
    opacity: 0;
  }
  #levelIntroBanner span {
    display: block;
    font-size: 13px;
    color: #f5d0a9;
    font-weight: 600;
    margin-top: 4px;
  }

</style>
<script>
window.inIntroScreen = true;
window.introAudioStarted = false;
window.startFromIntro = function(ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  window.inIntroScreen = false;
  var ov = document.getElementById("introOverlay");
  if (ov) ov.style.display = "none";
  var banner = document.getElementById("levelIntroBanner");
  if (banner && !window.introAudioStarted) {
    banner.style.opacity = "1";
    setTimeout(function() { banner.style.opacity = "0"; }, 3500);
  }
  if (!window.introAudioStarted && typeof window.unlockAudio === "function") {
    window.introAudioStarted = true;
    window.unlockAudio();
    if (typeof window.startAmbientMusicLoop === "function") window.startAmbientMusicLoop();
    if (typeof window.playSfx === "function") window.playSfx("pickup");
    if (typeof window.playVoiceChant === "function") window.playVoiceChant();
  }
};
</script>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ================= SISTEMA DE SONIDO Y AUDIOS REALES =================

// uses window.inIntroScreen
let musicInterval = null;
const emberCanvas = document.getElementById("emberCanvas");
const emberCtx = emberCanvas ? emberCanvas.getContext("2d") : null;
const embers = [];
for (let i = 0; i < 28; i++) {
  embers.push({
    x: Math.random() * 1280,
    y: Math.random() * 720,
    r: 3 + Math.random() * 6,
    vx: 15 + Math.random() * 35,
    vy: -(30 + Math.random() * 65),
    swaySpeed: 1.5 + Math.random() * 2.5,
    swayAmt: 18 + Math.random() * 28,
    seed: Math.random() * 100,
    alpha: 0.45 + Math.random() * 0.5,
    hue: 22 + Math.random() * 26
  });
}

function updateAndDrawEmbers(now, dt) {
  if (!window.inIntroScreen || !emberCtx) return;
  emberCtx.clearRect(0, 0, 1280, 720);
  const t = now * 0.001;
  embers.forEach(e => {
    e.x += (e.vx + Math.sin(t * e.swaySpeed + e.seed) * e.swayAmt) * dt;
    e.y += e.vy * dt;
    if (e.y < -20 || e.x > 1300) {
      e.y = 735;
      e.x = Math.random() * 1150 - 100;
    }
    const a = e.alpha * (0.6 + 0.4 * Math.abs(Math.sin(t * 2 + e.seed)));
    const grad = emberCtx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 2.2);
    grad.addColorStop(0, `hsla(${e.hue}, 100%, 65%, ${a})`);
    grad.addColorStop(1, `hsla(${e.hue}, 100%, 50%, 0)`);
    emberCtx.fillStyle = grad;
    emberCtx.beginPath();
    emberCtx.arc(e.x, e.y, e.r * 2.2, 0, Math.PI * 2);
    emberCtx.fill();
  });
}

// Melodía ambiental emotiva en Web Audio API + cantos de fondo
const bgMelodyNotes = [220.0, 261.63, 329.63, 293.66, 246.94, 196.0, 220.0, 164.81];
let melodyStep = 0;
function startAmbientMusicLoop() {
  if (musicInterval) return;
  musicInterval = setInterval(() => {
    if (soundMuted || !audioUnlocked) return;
    const freq = bgMelodyNotes[melodyStep % bgMelodyNotes.length];
    melodyStep++;
    playTone(freq, freq, 1.35, "sine", 0.08, 0);
    playTone(freq * 0.5, freq * 0.5, 1.45, "triangle", 0.06, 0);
  }, 1500);
}

    if (ov) ov.addEventListener(evt, window.startFromIntro, { passive: true });
  });
})();

voiceClips.forEach(vc => { vc.volume = 0.85; });
let voiceIdx = 0;
let lastVoiceTime = 0;

function ensureAudioContext() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().catch(() => {});
  }
}

function unlockAudio() {
  ensureAudioContext();
  if (!audioUnlocked) {
    audioUnlocked = true;
    if (!soundMuted) {
      if (usingFullBgm) {
        bgmFull.play().catch(() => {});
      } else {
        bgmFast.play().catch(() => {});
      }
      playVoiceChant();
    }
  }
}

window.addEventListener("touchstart", unlockAudio, { passive: true });
window.addEventListener("mousedown", unlockAudio, { passive: true });
window.addEventListener("keydown", unlockAudio, { passive: true });

function toggleSound() {
  ensureAudioContext();
  audioUnlocked = true;
  soundMuted = !soundMuted;
  const btn = document.getElementById("soundBtn");
  if (soundMuted) {
    btn.textContent = "🔇 SONIDO: OFF";
    bgmFast.pause();
    bgmFull.pause();
    voiceClips.forEach(vc => vc.pause());
  } else {
    btn.textContent = "🔊 SONIDO: ON";
    if (usingFullBgm) bgmFull.play().catch(() => {});
    else bgmFast.play().catch(() => {});
    playSfx("pickup");
  }
}

function playVoiceChant() {
  if (soundMuted || !audioUnlocked) return;
  const now = performance.now();
  if (now - lastVoiceTime < 2600) return;
  lastVoiceTime = now;
  const clip = voiceClips[voiceIdx % voiceClips.length];
  voiceIdx++;
  try {
    clip.currentTime = 0;
    clip.play().catch(() => {});
  } catch (e) {}
}

function playTone(freqStart, freqEnd, duration, type = "sine", vol = 0.25, delay = 0) {
  if (soundMuted) return;
  ensureAudioContext();
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, t0);
    if (freqEnd !== freqStart) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + duration);
    }
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration);
  } catch (e) {}
}

function playSfx(kind) {
  if (soundMuted) return;
  switch (kind) {
    case "jump":
      playTone(240, 560, 0.16, "sine", 0.28);
      break;
    case "step":
      playTone(115, 85, 0.045, "triangle", 0.14);
      break;
    case "swing":
      playTone(320, 140, 0.11, "triangle", 0.30);
      break;
    case "spin360":
      playTone(380, 160, 0.13, "sawtooth", 0.25, 0);
      playTone(460, 190, 0.15, "sawtooth", 0.25, 0.12);
      break;
    case "hit":
      playTone(190, 90, 0.12, "square", 0.32);
      playTone(420, 260, 0.09, "triangle", 0.25, 0.04);
      break;
    case "goose":
      playTone(210, 260, 0.09, "sawtooth", 0.18, 0);
      playTone(195, 245, 0.11, "sawtooth", 0.18, 0.11);
      break;
    case "pickup":
      playTone(523.25, 523.25, 0.09, "sine", 0.28, 0);
      playTone(659.25, 659.25, 0.09, "sine", 0.30, 0.07);
      playTone(783.99, 783.99, 0.16, "sine", 0.32, 0.14);
      break;
    case "damage":
      playTone(155, 75, 0.22, "sawtooth", 0.36);
      break;
    case "poison":
      playTone(310, 110, 0.18, "sawtooth", 0.36, 0);
      playTone(220, 65, 0.28, "square", 0.36, 0.16);
      break;
    case "win":
      playTone(523.25, 523.25, 0.16, "triangle", 0.34, 0);
      playTone(659.25, 659.25, 0.16, "triangle", 0.34, 0.15);
      playTone(783.99, 783.99, 0.18, "triangle", 0.34, 0.30);
      playTone(1046.5, 1046.5, 0.45, "triangle", 0.38, 0.46);
      break;
  }

for (const [k, src] of Object.entries(spriteFiles)) {
  const img = new Image();
  img.src = src;
  images[k] = img;
}

function isImgReady(img) {
  return img && img.complete && img.naturalWidth > 0;
}

function fillRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

const keys = {};
window.addEventListener("keydown", e => {
  if (window.inIntroScreen && (e.code === "Enter" || e.code === "Space")) { startFromIntro(); return; }
  unlockAudio();
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === "KeyV") triggerPickaxeSwing();
  if (e.code === "KeyO") triggerPickaxeSpin360();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

function bindTouchHold(btnId, keyCode, onTap) {
  const el = document.getElementById(btnId);
  if (!el) return;
  const start = (e) => {
    e.preventDefault();
    unlockAudio();
    keys[keyCode] = true;
    el.classList.add("active");
    if (onTap) onTap();
  };
  const end = (e) => {
    e.preventDefault();
    keys[keyCode] = false;
    el.classList.remove("active");
  };
  el.addEventListener("touchstart", start, { passive: false });
  el.addEventListener("touchend", end, { passive: false });
  el.addEventListener("touchcancel", end, { passive: false });
  el.addEventListener("mousedown", start);
  el.addEventListener("mouseup", end);
  el.addEventListener("mouseleave", end);
}

bindTouchHold("btnLeft", "ArrowLeft");
bindTouchHold("btnRight", "ArrowRight");
bindTouchHold("btnJump", "Space");
bindTouchHold("btnSwing", "KeyV", () => triggerPickaxeSwing());
bindTouchHold("btnSpin", "KeyO", () => triggerPickaxeSpin360());

const GROUND_Y = 560;
const WORLD_MAX_X = 360;
const SCALE = 75;

let player, enemies, bosses, geese, bottles, hearts, mushrooms, popups;
let cameraX = 0;
let gameWon = false;
let phraseIdx = 0;
let stepTimer = 0;

function initGame() {
  document.getElementById("victoryOverlay").style.display = "none";
  gameWon = false;

  player = {
    x: 2.0,
    y: 0,
    vy: 0,
    vx: 0,
    facing: 1,
    grounded: true,
    hearts: 5,
    maxHearts: 5,
    waterCount: 0,
    invulnTimer: 0,
    poisonedTimer: 0,
    walkTime: 0,
    pickAngle: -18,
    swingState: "idle",
    swingTimer: 0,
    bubbleText: "¡Ayuden a buscar a mi hijo!",
    bubbleTimer: 4.0,
    autoSpeakCooldown: 2.0
  };

  cameraX = player.x * SCALE - canvas.width * 0.32;

  enemies = [];
  bosses = [];
  geese = [];
  bottles = [];
  hearts = [];
  mushrooms = [];
  popups = [];

  [12, 38, 65, 95, 132, 162, 192, 222, 265, 305].forEach(bx => bottles.push({ x: bx, collected: false }));
  [20, 44, 78, 106, 142, 168, 202, 228, 252, 280, 318, 338].forEach(hx => hearts.push({ x: hx, collected: false }));
  [16.5, 33.2, 48, 70, 90.5, 110.5, 130, 150.5, 166.5, 190, 210.5, 226.5, 248, 272.5, 288.5, 310, 326.5, 343].forEach((mx, i) => mushrooms.push({ x: mx, phase: i * 1.1 }));

  for (let x = 8; x <= 345; x += 4.2) {
    enemies.push({
      x: x,
      y: 0,
      hp: 45,
      maxHp: 45,
      speed: 2.5 + (x % 3) * 0.35,
      phase: x * 0.7,
      dead: false
    });
  }

  const amloXs = [14, 29, 41.5, 54, 74, 86, 102.5, 115, 134, 146.5, 158.5, 174, 194, 206, 218.5, 235, 256, 268, 284.5, 295.5, 306, 318, 330, 335, 342, 348];
  amloXs.forEach((ax, idx) => {
    bosses.push({
      x: ax,
      hp: 100,
      maxHp: 100,
      isFinal: idx === amloXs.length - 1,
      throwTimer: 1.5 + (idx % 3) * 0.4,
      animState: "patrol",
      animStateTimer: 0,
      dead: false
    });
  });
}

function resetFullGame() { initGame(); }

function speakMotherPhrase() {
  player.bubbleText = frasesMadres[phraseIdx % frasesMadres.length];
  phraseIdx++;
  player.bubbleTimer = 2.8;
  player.autoSpeakCooldown = 3.2;
  playVoiceChant();
}

function triggerPickaxeSwing() {
  if (gameWon || player.swingState !== "idle") return;
  player.swingState = "swing";
  player.swingTimer = 0;
  playSfx("swing");
  speakMotherPhrase();
  performPickaxeHit(false);
}

function triggerPickaxeSpin360() {
  if (gameWon || player.swingState !== "idle") return;
  player.swingState = "spin360";
  player.swingTimer = 0;
  playSfx("spin360");
  speakMotherPhrase();
  performPickaxeHit(true);
}

function performPickaxeHit(is360) {
  const reach = is360 ? 2.5 : 2.1;
  let hitAny = false;
  enemies.forEach(e => {
    if (e.dead) return;
    const dx = e.x - player.x;
    const inFront = is360 || (dx * player.facing >= -0.4);
    if (inFront && Math.abs(dx) <= reach && Math.abs(player.y - e.y) < 1.8) {
      e.hp -= 60;
      hitAny = true;
      if (e.hp <= 0) {
        e.dead = true;
        checkVictoryCondition();
      }
    }
  });

  bosses.forEach(b => {
    if (b.dead) return;
    const dx = b.x - player.x;
    const inFront = is360 || (dx * player.facing >= -0.5);
    if (inFront && Math.abs(dx) <= reach + 0.3 && player.y < 2.0) {
      b.hp -= 60;
      hitAny = true;
      if (b.hp <= 0) {
        b.dead = true;
        if (b.isFinal) triggerWin();
        else checkVictoryCondition();
      }
    }
  });
  if (hitAny) playSfx("hit");
}

function checkVictoryCondition() {
  const aliveE = enemies.filter(e => !e.dead).length;
  const aliveB = bosses.filter(b => !b.dead).length;
  if (aliveE + aliveB <= 0) triggerWin();
}

function triggerWin() {
  if (gameWon) return;
  gameWon = true;
  playSfx("win");
  document.getElementById("victoryOverlay").style.display = "flex";
}

function damagePlayer() {
  if (player.invulnTimer > 0 || player.poisonedTimer > 0 || gameWon) return;
  player.hearts--;
  player.invulnTimer = 1.6;
  playSfx("damage");
  if (player.hearts <= 0) {
    popups.push({ x: player.x, y: 2.0, text: "¡VOLVIENDO AL INICIO!", color: "#ff5555", timer: 1.0 });
    setTimeout(() => initGame(), 450);
  }
}

function poisonAndKillPlayer() {
  if (player.poisonedTimer > 0 || gameWon) return;
  player.hearts = 0;
  player.poisonedTimer = 0.7;
  playSfx("poison");
  popups.push({ x: player.x, y: 2.2, text: "☠ ¡ENVENENADA POR HONGO! ☠", color: "#55ff44", timer: 1.2 });
  setTimeout(() => initGame(), 600);
}

let lastTime = performance.now();
function update(now) {
  requestAnimationFrame(update);
  const dt = Math.min(0.033, Math.max(0.001, (now - lastTime) / 1000));
  lastTime = now;

  if (window.inIntroScreen) { updateAndDrawEmbers(now, dt); } else if (!gameWon && player.poisonedTimer <= 0) {
    let move = 0;
    if (keys["ArrowRight"] || keys["KeyD"]) move += 1;
    if (keys["ArrowLeft"] || keys["KeyA"]) move -= 1;

    player.vx = move * 6.4;
    player.x = Math.max(-3, Math.min(WORLD_MAX_X, player.x + player.vx * dt));
    if (move > 0) player.facing = 1;
    else if (move < 0) player.facing = -1;

    if (Math.abs(move) > 0 && player.grounded) {
      player.walkTime += dt * 15;
      stepTimer -= dt;
      if (stepTimer <= 0) {
        stepTimer = 0.24;
        playSfx("step");
      }
    }

    if ((keys["Space"] || keys["KeyW"] || keys["ArrowUp"]) && player.grounded) {
      player.vy = 11.8;
      player.grounded = false;
      playSfx("jump");
    }

    if (keys["KeyO"] && player.swingState === "idle") {
      triggerPickaxeSpin360();
    }

    if (!player.grounded) {
      player.vy -= 26.0 * dt;
      player.y += player.vy * dt;
      if (player.y <= 0) {
        player.y = 0;
        player.vy = 0;
        player.grounded = true;
      }
    }

    if (player.x >= 350) triggerWin();

    if (player.invulnTimer > 0) player.invulnTimer -= dt;
    if (player.bubbleTimer > 0) player.bubbleTimer -= dt;
    if (player.autoSpeakCooldown > 0) player.autoSpeakCooldown -= dt;

    if (player.swingState === "swing") {
      player.swingTimer += dt;
      const dur = 0.26;
      const t = player.swingTimer / dur;
      if (t < 0.35) {
        player.pickAngle = -18 + (t / 0.35) * 86;
      } else if (t < 0.75) {
        player.pickAngle = 68 - ((t - 0.35) / 0.40) * 160;
      } else if (t < 1.0) {
        player.pickAngle = -92 + ((t - 0.75) / 0.25) * 74;
      } else {
        player.swingState = "idle";
        player.pickAngle = -18;
      }
    } else if (player.swingState === "spin360") {
      player.swingTimer += dt;
      const dur = 0.34;
      const t = player.swingTimer / dur;
      if (t <= 1.0) {
        player.pickAngle = -18 - t * 360;
        if (Math.abs(t - 0.5) < 0.06) performPickaxeHit(true);
      } else {
        player.swingState = "idle";
        player.pickAngle = -18;
      }
    } else {
      if (!player.grounded) {
        player.pickAngle = 42;
      } else if (Math.abs(move) > 0) {
        player.pickAngle = -18 + Math.sin(player.walkTime) * 38;
      } else {
        player.pickAngle = -18 + Math.sin(now * 0.003) * 7;
      }
    }

    bottles.forEach(b => {
      if (!b.collected && Math.abs(player.x - b.x) < 0.75 && player.y < 1.2) {
        b.collected = true;
        player.waterCount++;
        player.hearts = Math.min(player.maxHearts, player.hearts + 1);
        playSfx("pickup");
        popups.push({ x: b.x, y: 1.5, text: "+1 CORAZÓN (AGUA)", color: "#44ddff", timer: 1.0 });
      }
    });

    hearts.forEach(h => {
      if (!h.collected && Math.abs(player.x - h.x) < 0.75 && player.y < 1.2) {
        h.collected = true;
        player.hearts = Math.min(player.maxHearts, player.hearts + 1);
        playSfx("pickup");
        popups.push({ x: h.x, y: 1.5, text: "+1 VIDA", color: "#ff5577", timer: 1.0 });
      }
    });

    mushrooms.forEach(m => {
      if (Math.abs(player.x - m.x) < 0.42 && player.y < 0.52) {
        poisonAndKillPlayer();
      }
    });

    enemies.forEach(e => {
      if (e.dead) return;
      const dx = player.x - e.x;
      const dist = Math.abs(dx);
      if (dist <= 22) {
        if (dist <= 6 && player.autoSpeakCooldown <= 0) speakMotherPhrase();
        const dir = Math.sign(dx);
        if (dist > 0.7) e.x += dir * e.speed * dt;
        if (dist < 0.68) {
          if (player.y > 0.55 && player.vy < 0) {
            e.dead = true;
            player.vy = 10.5;
            playSfx("hit");
            speakMotherPhrase();
            checkVictoryCondition();
          } else if (player.y < 0.65) {
            damagePlayer();
          }
        }
      }
    });

    bosses.forEach(b => {
      if (b.dead) return;
      const dx = player.x - b.x;
      const dist = Math.abs(dx);
      if (dist <= 25) {
        const dir = Math.sign(dx);
        if (dist > 0.65) b.x += dir * 2.55 * dt;
        b.throwTimer -= dt;
        if (b.throwTimer <= 0) {
          b.throwTimer = 1.65;
          b.animState = "goose";
          b.animStateTimer = 0.45;
          if (dist <= 12) playSfx("goose");
          geese.push({ x: b.x + dir * 0.8, y: 0.45, vx: dir * 5.2, timer: 4.5 });
          setTimeout(() => {
            if (!b.dead && !gameWon) {
              geese.push({ x: b.x + dir * 0.8, y: 1.15, vx: dir * 5.6, timer: 4.5 });
            }
          }, 260);
          popups.push({ x: b.x, y: 2.1, text: "¡ME CANSO GANSO!", color: "#ffd833", timer: 0.9 });
        }
        if (b.animStateTimer > 0) {
          b.animStateTimer -= dt;
          if (b.animStateTimer <= 0) b.animState = "patrol";
        }
        if (dist < 0.72) {
          if (player.y > 0.7 && player.vy < 0) {
            b.hp -= 55;
            player.vy = 10.5;
            playSfx("hit");
            if (b.hp <= 0) {
              b.dead = true;
              if (b.isFinal) triggerWin();
              else checkVictoryCondition();
            }
          } else if (player.y < 0.7) {
            damagePlayer();
          }
        }
      }
    });

    geese.forEach(g => {
      g.x += g.vx * dt;
      g.timer -= dt;
      if (Math.abs(g.x - player.x) < 0.55 && Math.abs(player.y + 0.7 - g.y) < 0.55) {
        g.timer = 0;
        damagePlayer();
      }
    });
    geese = geese.filter(g => g.timer > 0);
  }

  popups.forEach(p => { p.y += dt * 0.8; p.timer -= dt; });
  popups = popups.filter(p => p.timer > 0);

  const targetCamX = player.x * SCALE - canvas.width * 0.32;
  cameraX += (targetCamX - cameraX) * Math.min(1, dt * 8);

  try {
    draw(now);
  } catch (err) {
    console.error(err);
  }
}

function drawSpeechBubble(screenX, screenY, text) {
  ctx.save();
  ctx.font = "bold 16px 'Segoe UI', sans-serif";
  const padX = 16;
  const textW = Math.max(185, ctx.measureText(text).width + padX * 2);
  const boxH = 44;
  const bx = screenX - textW / 2;
  const by = screenY - boxH - 14;

  ctx.fillStyle = "#fdfbf2";
  ctx.strokeStyle = "#1f1812";
  ctx.lineWidth = 3.5;
  fillRoundRect(bx, by, textW, boxH, 12);

  ctx.beginPath();
  ctx.moveTo(screenX - 10, by + boxH - 2);
  ctx.lineTo(screenX - 3, by + boxH + 13);
  ctx.lineTo(screenX + 8, by + boxH - 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#1a1410";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, screenX, by + boxH / 2);
  ctx.restore();
}

function drawPoisonMushroom(screenX, screenY, phase, now) {
  const pulse = Math.sin(now * 0.005 + phase) * 0.09;
  ctx.save();
  ctx.translate(screenX, screenY);
  ctx.scale(1 + pulse, 1 - pulse);

  ctx.fillStyle = "#e2dcc5";
  ctx.strokeStyle = "#1f1028";
  ctx.lineWidth = 2.5;
  ctx.fillRect(-7, -18, 14, 18);
  ctx.strokeRect(-7, -18, 14, 18);

  ctx.fillStyle = "#9222b8";
  ctx.beginPath();
  ctx.arc(0, -18, 20, Math.PI, 0, false);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#4eff38";
  [[-9, -24, 4], [0, -30, 4.5], [9, -23, 3.8], [-4, -20, 3], [6, -28, 3]].forEach(([cx, cy, r]) => {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

function drawSeBuscaPoster(screenX, screenY, idx) {
  const p = missingPeople[idx % missingPeople.length];
  const w = 64, h = 82;
  ctx.save();
  ctx.translate(screenX - w / 2, screenY - h / 2);

  ctx.fillStyle = "#f7f1e3";
  ctx.strokeStyle = "#382e26";
  ctx.lineWidth = 2;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeRect(0, 0, w, h);

  ctx.fillStyle = "#c41e1e";
  ctx.fillRect(2, 2, w - 4, 15);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 9px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("SE BUSCA", w / 2, 13);

  ctx.fillStyle = "#cbe0f0";
  ctx.fillRect(12, 20, w - 24, 34);
  ctx.strokeRect(12, 20, w - 24, 34);
  ctx.fillStyle = p.shirt;
  ctx.fillRect(16, 42, w - 32, 11);
  ctx.fillStyle = p.skin;
  ctx.beginPath();
  ctx.arc(w / 2, 33, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#241811";
  ctx.fillRect(w / 2 - 8, 23, 16, 5);

  ctx.fillStyle = "#1a120b";
  ctx.font = "bold 6.5px sans-serif";
  ctx.fillText(p.name, w / 2, 65);
  ctx.font = "6px sans-serif";
  ctx.fillText(p.info, w / 2, 75);

  ctx.restore();
}

function draw(now) {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  skyGrad.addColorStop(0, "#c87d55");
  skyGrad.addColorStop(1, "#f2c18d");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (isImgReady(images.cielo)) {
    ctx.drawImage(images.cielo, 0, 0, canvas.width, canvas.height);
  }

  const drawTiledLayer = (img, parallax, yPos, hSize, drawPosters = false) => {
    if (!isImgReady(img)) return;
    const tileW = hSize * (img.naturalWidth / img.naturalHeight);
    const offset = -(cameraX * parallax) % tileW;
    const baseTileIndex = Math.floor((cameraX * parallax) / tileW);
    for (let i = -1; i <= 3; i++) {
      const tx = offset + i * tileW;
      ctx.drawImage(img, tx, yPos, tileW + 2, hSize);
      if (drawPosters) {
        const houseIdx = Math.abs(baseTileIndex + i) * 4;
        for (let p = 0; p < 4; p++) {
          drawSeBuscaPoster(tx + tileW * (0.16 + p * 0.22), yPos + hSize * 0.67, houseIdx + p);
        }
      }
    }
  };

  drawTiledLayer(images.montanas, 0.2, 80, 420);
  drawTiledLayer(images.monte, 0.45, 160, 420);
  drawTiledLayer(images.casas, 1.0, 145, 435, true);

  ctx.fillStyle = "#5c4636";
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
  ctx.fillStyle = "#3d2e22";
  ctx.fillRect(0, GROUND_Y, canvas.width, 8);
  if (isImgReady(images.carretera)) {
    const rw = 180;
    const roff = -(cameraX % rw);
    for (let x = roff - rw; x < canvas.width + rw; x += rw) {
      ctx.drawImage(images.carretera, x, GROUND_Y - 12, rw + 2, 165);
    }
  }

  const drawProp = (img, wx, wy, w, h) => {
    if (!isImgReady(img)) return;
    const sx = wx * SCALE - cameraX;
    if (sx < -300 || sx > canvas.width + 300) return;
    ctx.drawImage(img, sx - w / 2, wy - h, w, h);
  };
  drawProp(images.letrero, 0.5, GROUND_Y + 5, 140, 140);
  drawProp(images.tienda, 62.0, GROUND_Y + 8, 220, 190);
  drawProp(images.parada, 354.0, GROUND_Y + 8, 200, 170);

  bottles.forEach(b => {
    if (b.collected) return;
    const sx = b.x * SCALE - cameraX;
    if (sx < -50 || sx > canvas.width + 50) return;
    const bob = Math.sin(now * 0.005 + b.x) * 4;
    ctx.fillStyle = "#33ccff";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    fillRoundRect(sx - 9, GROUND_Y - 34 + bob, 18, 30, 5);
  });

  hearts.forEach(h => {
    if (h.collected) return;
    const sx = h.x * SCALE - cameraX;
    if (sx < -50 || sx > canvas.width + 50) return;
    const bob = Math.sin(now * 0.006 + h.x) * 4;
    ctx.font = "28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("❤️", sx, GROUND_Y - 12 + bob);
  });

  mushrooms.forEach(m => {
    const sx = m.x * SCALE - cameraX;
    if (sx < -60 || sx > canvas.width + 60) return;
    drawPoisonMushroom(sx, GROUND_Y + 2, m.phase, now);
  });

  enemies.forEach(e => {
    if (e.dead) return;
    const sx = e.x * SCALE - cameraX;
    if (sx < -120 || sx > canvas.width + 120) return;
    const sy = GROUND_Y - e.y * SCALE;
    const wave = Math.sin(now * 0.015 + e.phase);
    const bounce = Math.abs(wave) * 11;
    const moveDir = player.x < e.x ? -1 : 1;
    // enemigo_presidenta mira naturalmente a la IZQUIERDA (-1), así que cuando camina a la izquierda hacia Esperanza (moveDir === -1), faceScale = +1 (¡siempre DE FRENTE!)
    const faceScale = moveDir === -1 ? 1 : -1;
    const tilt = (wave * 0.10) + (moveDir * 0.07);
    const walkStep = Math.floor((now * 0.010) + e.phase) % 2 === 0 ? images.enemigoW1 : images.enemigoW2;
    const eSpr = isImgReady(walkStep) ? walkStep : images.enemigo;

    ctx.save();
    ctx.translate(sx, sy - bounce);
    ctx.rotate(tilt);
    ctx.scale(faceScale * (1 + wave * 0.06), 1 - wave * 0.06);
    if (isImgReady(eSpr)) {
      ctx.drawImage(eSpr, -48, -118, 96, 118);
    }
    ctx.restore();
  });

  bosses.forEach(b => {
    if (b.dead) return;
    const sx = b.x * SCALE - cameraX;
    if (sx < -150 || sx > canvas.width + 150) return;
    const wave = Math.sin(now * 0.011 + b.x);
    const bounce = Math.abs(wave) * 8;
    const dir = player.x < b.x ? -1 : 1;
    const spr = b.animState === "goose" ? images.gooseThrow : (Math.floor(now / 180) % 2 === 0 ? images.amlo0 : images.amlo1);

    ctx.save();
    ctx.translate(sx, GROUND_Y - bounce);
    ctx.rotate(wave * 0.08);
    ctx.scale(dir, 1);
    if (isImgReady(spr)) {
      ctx.drawImage(spr, -58, -132, 116, 132);
    } else if (isImgReady(images.enemigo)) {
      ctx.drawImage(images.enemigo, -58, -132, 116, 132);
    }
    ctx.restore();

    ctx.fillStyle = "#222";
    ctx.fillRect(sx - 36, GROUND_Y - 148, 72, 8);
    ctx.fillStyle = "#ff3333";
    ctx.fillRect(sx - 36, GROUND_Y - 148, 72 * (b.hp / b.maxHp), 8);
  });

  geese.forEach(g => {
    const sx = g.x * SCALE - cameraX;
    const sy = GROUND_Y - g.y * SCALE;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(g.vx < 0 ? -1 : 1, 1);
    if (isImgReady(images.goose)) {
      ctx.drawImage(images.goose, -28, -24, 56, 48);
    }
    ctx.restore();
  });

  // 8. MUÑECA ESPERANZA ("LA CHICA DEL PICO") - 100% EMBEBIDA Y ANIMADA
  const px = player.x * SCALE - cameraX;
  const py = GROUND_Y - player.y * SCALE;
  const isMoving = Math.abs(player.vx) > 0.1 && player.grounded;
  const walkSin = isMoving ? Math.sin(player.walkTime) : 0;
  const walkBounce = isMoving ? Math.abs(walkSin) * 14 : 0;
  const bodyTilt = isMoving ? (walkSin * 0.12 + player.facing * 0.05) : (!player.grounded ? player.facing * 0.10 : 0);
  const sxScale = !player.grounded ? 0.92 : (1 + walkSin * 0.075);
  const syScale = !player.grounded ? 1.10 : (1 - walkSin * 0.075);

  let playerFrame = images.p0;
  if (!player.grounded) {
    playerFrame = images.pjump;
  } else if (isMoving) {
    const walkFrames = [images.p1, images.p2, images.p3, images.p4];
    const idx = Math.floor(player.walkTime * 0.85) % walkFrames.length;
    playerFrame = walkFrames[Math.abs(idx)] || images.p0;
  }

  if (player.invulnTimer <= 0 || Math.floor(now / 80) % 2 === 0) {
    ctx.save();
    ctx.translate(px, py - walkBounce);
    ctx.rotate(bodyTilt);
    ctx.scale(player.facing * sxScale, syScale);

    if (isImgReady(playerFrame)) {
      ctx.drawImage(playerFrame, -56, -152, 112, 152);
    } else if (isImgReady(images.p0)) {
      ctx.drawImage(images.p0, -56, -152, 112, 152);
    }

    // ÚNICO PICO en la mano de Esperanza (V = golpear, O = giro de 360°)
    ctx.save();
    ctx.translate(20, -74);
    ctx.rotate((-player.pickAngle * Math.PI) / 180);
    if (isImgReady(images.pico)) {
      ctx.drawImage(images.pico, -24, -52, 68, 68);
    }
    ctx.restore();

    ctx.restore();
  }

  if (player.bubbleTimer > 0) {
    drawSpeechBubble(px, py - 160 - walkBounce, player.bubbleText);
  }

  popups.forEach(p => {
    const sx = p.x * SCALE - cameraX;
    const sy = GROUND_Y - p.y * SCALE;
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#000";
    ctx.fillText(p.text, sx + 2, sy + 2);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, sx, sy);
  });

  // HUD de 5 Corazones
  ctx.fillStyle = "rgba(16, 12, 8, 0.85)";
  ctx.fillRect(18, 16, 490, 74);
  ctx.strokeStyle = "#d4af37";
  ctx.lineWidth = 2;
  ctx.strokeRect(18, 16, 490, 74);

  for (let i = 0; i < player.maxHearts; i++) {
    ctx.font = "28px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(i < player.hearts ? "❤️" : "🖤", 32 + i * 38, 52);
  }
  ctx.fillStyle = "#ffe8a3";
  ctx.font = "bold 15px sans-serif";
  ctx.fillText(`Agua: ${player.waterCount}/10   |   Avance: ${Math.max(0, Math.min(100, Math.round((player.x / 350) * 100)))}%`, 240, 46);
  ctx.fillStyle = "#dcd4c8";
  ctx.font = "13px sans-serif";
  ctx.fillText("Controles: [◀/▶] Caminar  •  [▲] Saltar hongos  •  [⛏️ V] Pico  •  [🌀 O] Giro 360°", 32, 78);
}

initGame();
draw(performance.now());
if (!window.inIntroScreen && !window.introAudioStarted) {
  window.introAudioStarted = true;
  unlockAudio();
  startAmbientMusicLoop();
  playSfx("pickup");
  playVoiceChant();
}
requestAnimationFrame(update);
</script>
</body>
</html>
